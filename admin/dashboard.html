<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Panel</title>
  <link rel="stylesheet" href="../css/admin.css?v=2">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-admin>

<header>
  <h1>Panel de administración</h1>
  <div class="acciones-header">
    <button id="btn-logout">Cerrar sesión</button>
  </div>
</header>

<main class="admin-main">
  <a href="form.html" class="btn-agregar">+ Agregar nuevo animal</a>

  <section class="admin-filtros" aria-label="Filtrar animales">
    <input type="search" id="admin-buscar" placeholder="Buscar por nombre...">
    <select id="admin-filtro-especie">
      <option value="">Especies</option>
    </select>
    <select id="admin-filtro-edad">
      <option value="">Edades</option>
      <option value="cachorro">Cachorro</option>
      <option value="joven">Joven</option>
      <option value="adulto">Adulto</option>
    </select>
    <select id="admin-filtro-sexo">
      <option value="">Sexos</option>
      <option value="macho">Macho</option>
      <option value="hembra">Hembra</option>
    </select>
    <select id="admin-filtro-tamano">
      <option value="">Tamaños</option>
      <option value="chico">Chico</option>
      <option value="mediano">Mediano</option>
      <option value="grande">Grande</option>
    </select>
    <select id="admin-filtro-estado">
      <option value="">Estados</option>
      <option value="disponible">Disponible</option>
      <option value="adoptado">Adoptado</option>
    </select>
  </section>

    <table id="tabla-animales">
      <thead>
        <tr>
          <th>Foto</th>
          <th>Nombre</th>
          <th>Código</th>
          <th>Especie</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="cuerpo-tabla">
        <!-- Se llena con JS -->
      </tbody>
    </table>
  </main>

  <script type="module" src="admin.js"></script>
  <script type="module" src="../js/aplicarTema.js"></script>
</body>
</html>
