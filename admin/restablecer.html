<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer contraseña</title>
  <link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-admin>

  <div class="login-container">
    <h1>Nueva contraseña</h1>
    <p class="login-texto">Ingresá tu nueva contraseña.</p>
    <form id="form-restablecer">
      <input type="password" id="nueva-password" placeholder="Nueva contraseña" required minlength="6">
      <input type="password" id="confirmar-password" placeholder="Confirmar contraseña" required minlength="6">
      <button type="submit">Guardar contraseña</button>
      <p id="error-msg" class="error-msg"></p>
      <p id="exito-msg" class="exito-msg"></p>
    </form>
    <a href="login.html" class="login-link">← Volver al login</a>
  </div>

  <script type="module">
    import { supabase } from '../js/supabaseClient.js';

    const form = document.getElementById('form-restablecer');
    const error_msg = document.getElementById('error-msg');
    const exito_msg = document.getElementById('exito-msg');

    const hash = window.location.hash;
    if (!hash || !hash.includes('access_token')) {
        error_msg.textContent = 'Link inválido o expirado. Solicitá uno nuevo.';
        form.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        error_msg.textContent = '';
        exito_msg.textContent = '';

        const nueva = document.getElementById('nueva-password').value;
        const confirmar = document.getElementById('confirmar-password').value;

        if (nueva !== confirmar) {
            error_msg.textContent = 'Las contraseñas no coinciden.';
            return;
        }

        if (nueva.length < 6) {
            error_msg.textContent = 'La contraseña debe tener al menos 6 caracteres.';
            return;
        }

        const { error } = await supabase.auth.updateUser({ password: nueva });

        if (error) {
            error_msg.textContent = 'Error: ' + error.message;
            return;
        }

        exito_msg.textContent = 'Contraseña actualizada correctamente.';
        form.reset();
        setTimeout(() => { window.location.href = 'login.html'; }, 2500);
    });
  </script>
</body>
</html>
