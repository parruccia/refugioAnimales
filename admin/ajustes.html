<!-- admin/ajustes.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ajustes - Colitas Chochas</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body data-admin>
  <header>
    <h1>Ajustes del refugio</h1>
  </header>

  <main class="admin-main">
    <form id="form-ajustes">
      <label for="nombreRefugio">Nombre del refugio</label>
      <input type="text" id="nombreRefugio" name="nombreRefugio">

      <label for="logoArchivo">Logo</label>
      <img id="logo-actual" src="" alt="Logo del refugio" style="display: none;">
      <input type="file" id="logoArchivo" name="logoArchivo" accept="image/*">

      <label for="colorHeader">Color del header</label>
      <input type="color" id="colorHeader" name="colorHeader">

      <label for="colorBody">Color de fondo</label>
      <input type="color" id="colorBody" name="colorBody">

      <label for="instagramUser">Usuario de Instagram (sin @)</label>
      <input type="text" id="instagramUser" name="instagramUser" placeholder="refugiocolitaschochas">

      <label for="whatsappNumero">Número de WhatsApp (con código de país, sin +)</label>
      <input type="text" id="whatsappNumero" name="whatsappNumero" placeholder="5493531234567">

      <button type="submit">Guardar cambios</button>
    </form>
    <p id="mensaje-estado"></p>
  </main>
  
</body data-admin>

  <script type="module" src="../admin/ajustes.js"></script>
  <script type="module" src="../js/aplicarTema.js"></script></body>
</html>
